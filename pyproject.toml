[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naver-searchad-mcp"
version = "0.3.0"
description = "Official-docs-driven MCP server for Naver SearchAd API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JU JIHYEON"}]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.28,<2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "build>=1.2",
  "hatchling>=1.26",
]

[project.scripts]
naver-searchad-mcp = "naver_searchad_mcp.server:main"
naver-searchad-review = "naver_searchad_mcp.review:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naver_searchad_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"docs/official-spec" = "naver_searchad_mcp/data/official-spec"
"skills/naver-searchad-usage" = "naver_searchad_mcp/data/usage-guide"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
